packages:
  - basic
  - solid-element
  - with-rspack
  - with-vanila-extract
  - with-vite-pages
  - with-vite-tsrx

allowBuilds:
  core-js: false
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.14.0
  - handlebars@4.7.10

overrides:
  chokidar: '>=5'
  handlebars@>=4.0.0 <=4.7.9: ^4.7.10
  semver: '>=7'
  seroval@<=1.6.2: ^1.6.3

trustPolicy: no-downgrade
trustPolicyExclude:
  - 'vite@6.4.1'
