packages:
  - ./basic
  - ./solid-element
  - ./with-rspack
  - ./with-vanila-extract
  - ./with-vite-pages
  - ./with-vite-tsrx

allowBuilds:
  core-js: false
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.0.0
  - handlebars@4.7.9
  - brace-expansion@5.0.8
  - js-yaml@4.3.1

overrides:
  chokidar: '>=5'
  semver: '>=7'

trustPolicy: no-downgrade
trustPolicyExclude:
  - 'vite@6.4.1'
