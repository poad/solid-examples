packages:
  - basic
  - solid-element
  - with-rspack
  - with-vanila-extract
  - with-vite-pages
  - with-vite-tsrx

allowBuilds:
  core-js: false
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.21.0
  - '@solidjs/babel-plugin@2.0.0 || 2.0.2'
  - '@solidjs/compiler-darwin-arm64@2.0.0'
  - '@solidjs/compiler-darwin-x64@2.0.0'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.0'
  - '@solidjs/compiler-linux-x64-gnu@2.0.0'
  - '@solidjs/compiler-wasm32-wasi@2.0.0'
  - '@solidjs/compiler-win32-x64-msvc@2.0.0'
  - '@solidjs/compiler@2.0.0'
  - '@solidjs/web@2.0.0 || 2.0.3'
  - solid-loader@0.1.1 || 1.0.1
  - '@solidjs/element@2.0.1'
  - '@solidjs/signals@2.0.3'
  - solid-js@2.0.3
  - '@solidjs/router@2.0.0'
  - '@solidjs/vite-plugin@3.0.1'
  - '@rsbuild/plugin-solid@2.0.0'

overrides:
  chokidar: '>=5'
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'
  seroval@<=1.6.7: ^1.6.8
  seroval@>=1.5.5 <1.6.10: ^1.6.10

trustPolicy: no-downgrade
# trustPolicyExclude:
#  - 'vite@6.4.1'
