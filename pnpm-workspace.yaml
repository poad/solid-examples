packages:
  - basic
  - solid-element
  - with-rspack
  - with-vanila-extract
  - with-vite-pages
  - with-vite-tsrx

allowBuilds:
  core-js: false
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.24.0
  - '@pnpm/exe.android-arm64@12.24.0'
  - '@pnpm/exe.android-x64@12.24.0'
  - '@pnpm/exe.darwin-arm64@12.24.0'
  - '@pnpm/exe.darwin-x64@12.24.0'
  - '@pnpm/exe.freebsd-x64@12.24.0'
  - '@pnpm/exe.linux-arm64-musl@12.24.0'
  - '@pnpm/exe.linux-arm64@12.24.0'
  - '@pnpm/exe.linux-loong64@12.24.0'
  - '@pnpm/exe.linux-ppc64@12.24.0'
  - '@pnpm/exe.linux-riscv64@12.24.0'
  - '@pnpm/exe.linux-s390x@12.24.0'
  - '@pnpm/exe.linux-x64-musl@12.24.0'
  - '@pnpm/exe.linux-x64@12.24.0'
  - '@pnpm/exe.netbsd-x64@12.24.0'
  - '@pnpm/exe.win32-arm64@12.24.0'
  - '@pnpm/exe.win32-x64@12.24.0'

  - '@solidjs/babel-plugin@2.0.2'
  - '@solidjs/compiler-darwin-arm64@2.0.0'
  - '@solidjs/compiler-darwin-x64@2.0.0'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.0'
  - '@solidjs/compiler-linux-x64-gnu@2.0.0'
  - '@solidjs/compiler-wasm32-wasi@2.0.0'
  - '@solidjs/compiler-win32-x64-msvc@2.0.0'
  - '@solidjs/compiler@2.0.0'
  - '@solidjs/web@2.0.4'
  - '@solidjs/signals@2.0.4'
  - solid-js@2.0.4
  - eslint-plugin-solid@0.20.1
  - '@solidjs/router@2.0.1'
  - '@solidjs/vite-plugin@3.0.1'
  - solid-icons@2.0.0
  - solid-use@1.0.0
  - '@solidjs/element@2.0.1'
  - solid-loader@1.0.1

overrides:
  chokidar: '>=5'
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'
  seroval@<=1.6.7: ^1.6.8
