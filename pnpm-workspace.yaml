packages:
  - ./basic
  - ./solid-element
  - ./with-ripple
  - ./with-rspack
  - ./with-vanila-extract
  - ./with-vite-pages
  - ./with-vite-tsrx

allowBuilds:
  core-js: false
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - devalue@5.8.1
  - ws@8.20.1
  - srvx@0.11.13
  - tinyexec@1.2.3

  - '@ripple-ts/*'
  - '@rolldown/*'
  - '@tsrx/*'

overrides:
  chokidar: '>=5'
  devalue@>=5.6.3 <=5.8.0: ^5.8.1
  h3: ^2.0.1-rc.22
  handlebars@>=4.0.0 <4.7.9: '>=4.7.9'
  semver: '>=7'
  srvx@<0.11.13: ^0.11.13
  ws@>=8.0.0 <8.20.1: ^8.20.1
  '@ripple-ts/adapter': ^0.3
  vite: ^8.0.14

trustPolicy: no-downgrade
trustPolicyExclude:
  - 'vite@6.4.1'
