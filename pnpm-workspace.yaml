packages:
  - ./basic
  - ./solid-element
  - ./with-rspack
  - ./with-vanila-extract
  - ./with-vite-pages
  - ./with-vite-tsrx

allowBuilds:
  core-js: false
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
