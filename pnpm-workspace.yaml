packages:
  - basic
  - solid-element
  - with-rspack
  - with-vanila-extract
  - with-vite-pages
  - with-vite-tsrx

allowBuilds:
  core-js: false
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.19.0

overrides:
  chokidar: '>=5'
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'
  seroval@<=1.6.7: ^1.6.8
  seroval@>=1.5.5 <1.6.10: ^1.6.10

trustPolicy: no-downgrade
trustPolicyExclude:
  - 'vite@6.4.1'
